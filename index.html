<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <title>Overwatch Hero Roulette</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="index.css">
    <script type="module" src="index.js"></script>
  </head>
  <body>
    <!-- Sticky Selected Hero Section (Top) -->
    <header>
      <div id="current-hero">
        <div id="current-hero-info">
          <div class="center">
            <img id="current-hero-icon" style="width: 64px; height: auto;" />
          </div>

          <div class="center">
            <img id="current-hero-role-icon" style="width: 24px; height: auto;" />
          </div>

          <div id="current-hero-name"/></div>
        </div>
        <div id="current-hero-results">
          <button id="current-hero-win">Win</button>
          <button id="current-hero-lost">Lost</button>
        </div>
      </div>
      <div id="banner">
        No more hero to select
      </div>
    </header>

    <!-- Scrollable Hero Grid Container -->
    <main class="hero-grid-container">
      <div id="hero-list">
      </div>
      <!-- Buttons will be dynamically inserted at bottom of main -->
    </main>

    <!-- Footer with Action Buttons (Bottom) -->
    <footer>
      <div id="action-buttons" style="display: flex; gap: 8px;">
        <button id="select-random">Select Random Hero</button>
        <button id="load-json">Load JSON</button>
        <button id="save-json">Save JSON</button>
        <button id="reset">Reset</button>
        <a href="obs_webviews/hero-status/hero-status.html" target="_blank">Hero Status</a>
        <a href="obs_webviews/hero-wheel/hero-wheel.html" target="_blank">Hero Wheel</a>
      </div>
    </footer>
  </body>
</html>
