<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <title>Hero Grid Webview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="components/hero-grid/hero-grid.css">
    <script src="fit.js"></script>
  </head>
  <body>
    <header>
    </header>
    <main>
			<div id="hero-grid">
			</div>
    </main>
    <footer>
    </footer>
    <script type="module">
      import { seedHeroes } from '../store/seed.js';
      import { mountHeroGrid } from './components/hero-grid/hero-grid.js';

      try {
        await seedHeroes();
        mountHeroGrid(document.getElementById('hero-grid'));
      } catch (error) {
        console.error('Error loading heroes:', error);
        document.querySelector('main').innerHTML = '<p style="color: #e74c3c;">Error loading hero data</p>';
      }
    </script>
  </body>
</html>
