name: Preview
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
jobs:
  deploy:
    # Fork PRs get a read-only token and can't be previewed.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_deploy.yml
  comment:
    needs: deploy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            Preview: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/
