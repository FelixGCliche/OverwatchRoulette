# Reusable: assembles prod (/), dev (/dev/) and open dev-targeting PR previews (/pr-N/)
# into one Pages artifact and deploys it. Pages hosts a single artifact per repo,
# so every deploy rebuilds all three from their current refs.
name: Deploy Pages (reusable)

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          set -euo pipefail

          # Export the fetched commit into $1, leaving out repo-only files.
          export_tree() {
            mkdir -p "$1"
            git archive "$2" -- . ':!.github' ':!.claude' ':!docs' ':!*.md' | tar -x -C "$1"
          }

          export_tree _site HEAD

          # Dev (branch may not exist yet)
          if git fetch --depth=1 origin dev 2>/dev/null; then
            export_tree _site/dev FETCH_HEAD
          fi

          # Previews: open same-repo PRs targeting dev
          for n in $(gh pr list --base dev --state open --json number,isCrossRepository             --jq '.[] | select(.isCrossRepository | not) | .number'); do
            git fetch --depth=1 origin "refs/pull/${n}/head"
            export_tree "_site/pr-${n}" FETCH_HEAD
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
