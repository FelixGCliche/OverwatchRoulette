# Reusable: assembles prod (/), dev (/dev/) and open dev-targeting PR previews (/pr-N/)
# into one Pages artifact and deploys it. Pages hosts a single artifact per repo,
# so every deploy rebuilds all three from their current refs.
name: Deploy Pages (reusable)

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: ./.github/actions/assemble-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
